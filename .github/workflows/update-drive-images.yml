name: Update Drive images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-drive-images:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write Google Drive secret
        run: |
          mkdir -p secrets
          printf '%s\n' "${{ secrets.GOOGLE_DRIVE_FLOWERS_API }}" > secrets/google_drive.txt

      - name: Update Drive images
        run: node ./scripts/fetch_google_drive_images.ts

      - name: Build site
        run: npm run build

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/our_flowers
          if git diff --cached --quiet; then
            echo "No image changes to commit"
          else
            git commit -m "chore: update Drive flower images"
            git push
          fi
