name: Update news posts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write Notion secrets
        run: |
          mkdir -p secrets
          printf '%s\n%s\n%s\n' "${{ secrets.NOTION_API_KEY }}" "${{ secrets.NOTION_DATABASE_ID }}" "${{ secrets.NOTION_CONTROLS_DB_ID }}" > secrets/notion.txt
          printf '%s\n' "${{ secrets.GOOGLE_DRIVE_FLOWERS_API }}" > secrets/google_drive.txt

      - name: Generate news posts
        run: node ./scripts/fetch_news_posts_and_generate.ts

      - name: Build site
        run: npm run build

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update generated news posts"
            git push
          fi
